services:
  - type: web
    name: gate0-demo
    env: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: GATE0_RUNTIME_TTL_SECONDS
        value: 1800
      - key: GATE0_MAX_UPLOAD_MB
        value: 100
      - key: GATE0_DEMO_USER
        value: gate0
