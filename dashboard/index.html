<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Gate0 Dashboard v2</title>
<style>
:root{
--bg:#f6f7fb;--card:#fff;--line:#e5e7eb;--text:#0f172a;--muted:#667085;
--green:#16a34a;--amber:#f59e0b;--red:#dc2626;--blue:#2563eb;--black:#111827;
}
*{box-sizing:border-box}body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text)}
.shell{max-width:1480px;margin:0 auto;padding:22px}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.brand{display:flex;gap:12px;align-items:center}.logo{width:42px;height:42px;border-radius:14px;background:#111827;color:#fff;display:grid;place-items:center;font-weight:950}
.brand h1{margin:0;font-size:22px;letter-spacing:-.04em}.sub{font-size:13px;color:var(--muted)}
.actions a{display:inline-flex;text-decoration:none;background:#111827;color:white;border-radius:999px;padding:11px 16px;font-weight:850;font-size:14px}
.hero{display:block;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:0 10px 35px rgba(15,23,42,.06)}
.decision-row{display:flex;align-items:center;gap:16px}.decision-icon{width:76px;height:76px;border-radius:24px;display:grid;place-items:center;color:#fff;font-size:34px;font-weight:950}
.decision-icon.GO{background:var(--green)}.decision-icon.GO_WITH_NOTES{background:#65a30d}.decision-icon.HOLD{background:var(--amber)}.decision-icon.NO_GO{background:var(--red)}
.kicker{font-size:12px;color:var(--muted);font-weight:850;text-transform:uppercase;letter-spacing:.08em}.decision{font-size:32px;font-weight:950;letter-spacing:-.05em;margin:2px 0}
.headline{color:#344054;font-size:15px;line-height:1.45;margin-top:10px}.score{font-size:42px;font-weight:950;letter-spacing:-.07em}.score small{font-size:18px;color:var(--muted)}
.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}.meta div{background:#f8fafc;border:1px solid #edf2f7;border-radius:16px;padding:12px}
.meta b{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}.meta span{font-size:14px;font-weight:850}
.main{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(390px,.85fr);gap:16px}
.viewer{height:720px;padding:0;overflow:hidden}.viewer iframe{width:100%;height:100%;border:0;background:white;border-radius:24px}
.side{display:flex;flex-direction:column;gap:16px}.section-title{font-size:13px;color:var(--muted);font-weight:950;text-transform:uppercase;letter-spacing:.08em;margin:0 0 12px}
.risk-list{display:flex;flex-direction:column;gap:10px}.risk-item{border:1px solid var(--line);border-radius:18px;padding:14px;cursor:pointer;background:#fff}
.risk-item.active{outline:3px solid rgba(37,99,235,.16);border-color:#93c5fd}.risk-top{display:flex;justify-content:space-between;gap:10px;align-items:center}
.risk-title{font-weight:950}.badge{border-radius:999px;padding:5px 9px;color:#fff;font-size:10px;font-weight:950}.CRITICAL{background:var(--red)}.WARNING{background:var(--amber)}.INFO{background:var(--blue)}.PASS{background:var(--green)}
.risk-comment{margin:8px 0 0;color:#475467;font-size:13px;line-height:1.38}
.detail h2{font-size:22px;margin:0 0 8px;letter-spacing:-.03em}.detail-comment{font-size:15px;line-height:1.5;color:#344054}
.info-box{background:#f8fafc;border:1px solid #edf2f7;border-radius:16px;padding:14px;margin-top:12px}
.info-box b{display:block;font-size:12px;color:#667085;text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px}.info-box div{font-size:14px;line-height:1.4}
.empty{color:#667085;font-size:14px;line-height:1.5}
@media(max-width:1000px){.hero,.main{grid-template-columns:1fr}.viewer{height:520px}.meta{grid-template-columns:1fr 1fr}}

.hero-card{padding:18px 20px}
.hero-top{display:flex;align-items:center;gap:28px}
.hero-decision{display:flex;align-items:center;gap:14px;min-width:300px}
.hero-score{min-width:150px}
.hero-meta{flex:1;display:grid;grid-template-columns:1.5fr .9fr .9fr .7fr;gap:10px}
.hero-meta div{background:#f8fafc;border:1px solid #edf2f7;border-radius:14px;padding:10px;min-height:64px}
.hero-meta b{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.hero-meta span{font-size:14px;font-weight:850;line-height:1.25;word-break:break-word}
.hero-summary{margin-top:10px;color:#475467;font-size:14px;line-height:1.4;max-width:860px}
.hero-summary span+span{margin-left:6px}
@media(max-width:1000px){
.hero-top{flex-direction:column;align-items:flex-start}
.hero-meta{width:100%;grid-template-columns:1fr 1fr}
}


/* Compact UX v2 */
.hero-summary{
    margin-top:8px;
    color:#475467;
    font-size:13px;
    line-height:1.35;
    max-width:920px;
}

.detail-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-top:14px;
}

.detail-grid .info-box{
    margin-top:0;
    min-height:92px;
}

.action-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    margin-top:12px;
}

.action-row .info-box{
    flex:1;
    margin-top:0;
}

.future-btn{
    min-width:220px;
    border:0;
    border-radius:999px;
    padding:14px 18px;
    background:#111827;
    color:white;
    font-weight:950;
    font-size:14px;
    cursor:not-allowed;
    opacity:.92;
}

@media(max-width:1000px){
    .detail-grid{grid-template-columns:1fr}
    .action-row{flex-direction:column;align-items:stretch}
    .future-btn{width:100%}
}

</style>
</head>
<body>
<div class="shell">
  <header class="header">
    <div class="brand">
      <div class="logo">G0</div>
      <div><h1>Gate0 Packaging QA</h1><div class="sub">Operational Release Dashboard</div></div>
    </div>
    <div class="actions"><a href="/">Nuevo análisis</a></div>
  </header>

  
  <section class="hero">
    <div class="card hero-card">
      <div class="hero-top">
        <div class="hero-decision">
          <div class="decision-icon" id="decisionIcon">?</div>
          <div>
            <div class="kicker">Decisión Gate0</div>
            <div class="decision" id="decision">-</div>
          </div>
        </div>

        <div class="hero-score">
          <div class="kicker">Readiness Score</div>
          <div class="score"><span id="score">-</span><small>/100</small></div>
        </div>

        <div class="hero-meta">
          <div><b>Archivo</b><span id="file">-</span></div>
          <div><b>Cliente</b><span id="client">-</span></div>
          <div><b>Proceso</b><span id="process">-</span></div>
          <div><b>Páginas</b><span id="pages">-</span></div>
        </div>
      </div>

      <div class="hero-summary">
        <span id="headline"></span>
        <span id="userMessage"></span>
      </div>
    </div>
  </section>


  <section class="main">
    <div class="card viewer"><iframe src="/api/pdf" title="PDF analizado"></iframe></div>

    <aside class="side">
      <div class="card">
        <h3 class="section-title">Top Risks</h3>
        <div id="riskList" class="risk-list"></div>
      </div>

      <div class="card detail">
        <h3 class="section-title">Riesgo seleccionado</h3>
        <div id="riskDetail" class="empty">Selecciona un riesgo para ver comentario experto, evidencia e impacto.</div>
      </div>
    </aside>
  </section>
</div>

<script>
const $=id=>document.getElementById(id);
let currentReport=null,currentRisks=[];

function sev(r){return r.business_severity||r.severity||"INFO"}
function esc(s){return String(s??"-").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}
function decisionIcon(d){return d==="GO"?"✓":d==="GO_WITH_NOTES"?"✓":d==="HOLD"?"!":d==="NO_GO"?"×":"?"}

function normalize(data){
  const ra=data.readiness_assessment||data.readiness||{};
  const rs=data.readiness_summary||{};
  return {
    file:data.file||"-",
    client:data.client||"Sin cliente",
    process:data.process||data.business_assessment?.process||"flexo",
    pages:data.pages||data.pdf_structure?.page_count||1,
    decision:rs.decision||ra.readiness_decision||"-",
    status:rs.status||ra.readiness_status||"-",
    score:rs.score||ra.readiness_score||"-",
    headline:rs.headline||"Resultado Gate0",
    userMessage:rs.user_message||rs.next_action||"",
    risks:rs.top_risks||[]
  }
}

function render(data){
  const d=normalize(data); currentRisks=d.risks;
  $("decision").textContent=d.decision;
  $("decisionIcon").textContent=decisionIcon(d.decision);
  $("decisionIcon").className="decision-icon "+d.decision;
  $("headline").textContent=d.headline;
  $("userMessage").textContent=d.userMessage;
  $("score").textContent=d.score;
  $("file").textContent=d.file;
  $("client").textContent=d.client;
  $("process").textContent=d.process;
  $("pages").textContent=d.pages;

  renderRisks(currentRisks);
  if(currentRisks.length) selectRisk(0);
  else $("riskDetail").innerHTML='<div class="empty">No hay riesgos principales WARNING/CRITICAL para mostrar.</div>';
}

function renderRisks(risks){
  const box=$("riskList");
  if(!risks.length){box.innerHTML='<div class="empty">Sin riesgos principales.</div>';return}
  box.innerHTML=risks.map((r,i)=>`
    <div class="risk-item" id="risk-${i}" onclick="selectRisk(${i})">
      <div class="risk-top">
        <div class="risk-title">${esc(r.title||r.check)}</div>
        <span class="badge ${esc(sev(r))}">${esc(sev(r))}</span>
      </div>
      <div class="risk-comment">${esc(r.expert_comment||r.risk_reason||r.detail||"Revisar hallazgo.")}</div>
      ${r.occurrence_count>1?`<div class="risk-comment"><b>${r.occurrence_count}</b> ocurrencias detectadas</div>`:""}
    </div>`).join("");
}

function selectRisk(i){
  document.querySelectorAll(".risk-item").forEach(x=>x.classList.remove("active"));
  const el=$("risk-"+i); if(el)el.classList.add("active");
  const r=currentRisks[i]; if(!r)return;

  const ev=r.risk_evidence||{};
  const insight=r.expert_insight||{};
  $("riskDetail").innerHTML=`
    <div class="risk-top">
      <h2>${esc(r.title||r.check)}</h2>
      <span class="badge ${esc(sev(r))}">${esc(sev(r))}</span>
    </div>

    <div class="detail-comment">${esc(r.expert_comment||insight.brief_comment||r.risk_reason||"Revisar hallazgo.")}</div>

    <div class="detail-grid">
      <div class="info-box">
        <b>Detectado</b>
        <div>${esc(ev.detected_value||insight.evidence?.detected_value||r.value||r.detail||"-")}</div>
      </div>

      <div class="info-box">
        <b>Umbral / criterio</b>
        <div>${esc(ev.threshold||"-")}</div>
      </div>

      <div class="info-box">
        <b>Impacto en decisión</b>
        <div>${esc(r.decision_impact||"Contribuye a la evaluación general del archivo.")}</div>
      </div>
    </div>

    <div class="action-row">
      <div class="info-box">
        <b>Qué hacer ahora</b>
        <div>${esc(insight.recommended_action||r.action||r.recommendation||"Revisar antes de liberar.")}</div>
      </div>

      <button class="future-btn" disabled>⚡ Sugerir correcciones</button>
    </div>
  `;
}

async function loadReport(){
  try{
    const res=await fetch("/api/report",{cache:"no-store"});
    if(!res.ok)throw new Error("No se pudo cargar /api/report");
    currentReport=await res.json();
    render(currentReport);
  }catch(e){
    $("headline").textContent="No se pudo cargar el reporte.";
    $("userMessage").textContent=e.message;
  }
}

loadReport();
</script>
</body>
</html>
